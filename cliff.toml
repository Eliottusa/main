# Configuration git-cliff — https://git-cliff.org
[changelog]
header = "# Changelog\n\n"
body = """
## [{{ version }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | trim }}{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true   # Attend des commits au format "feat:", "fix:"...
filter_unconventional = true

commit_parsers = [
  { message = "^feat",     group = "Ajouté"   },
  { message = "^fix",      group = "Corrigé"  },
  { message = "^refactor", group = "Modifié"  },
  { message = "^docs",     group = "Docs"     },
  { message = "^chore",    skip = true        },
]
